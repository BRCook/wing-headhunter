[project]
name = "wing-headhunter"
version = "0.1.0"
description = "Remote preamp control for Behringer Wing consoles connected over Dante."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "netaudio",
    "zeroconf",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
headhunter = "headhunter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headhunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
