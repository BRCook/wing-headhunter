[project]
name = "wing-headhunter"
version = "0.1.0"
description = "Remote preamp control for Behringer Wing consoles connected over Dante."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "netaudio",
    "zeroconf",
]

[project.scripts]
headhunter-discover = "headhunter.discovery:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headhunter"]